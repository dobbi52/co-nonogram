      <div style="padding: 12px; border: 3px solid #3A4466; display: flex; flex-direction: column; gap: 10px">

        <div style="font-family: 'Press Start 2P', monospace; font-size: 20px; color: #39FF88">24</div>
      </div>
      <div style="padding: 12px; border: 3px solid #3A4466; display: flex; flex-direction: column; gap: 10px">
        <div style="font-size: 18px; color: #8A93C2">그림 맞힌 친구</div>
        <div style="font-family: 'Press Start 2P', monospace; font-size: 20px; color: #FF4FA3">18</div>
      </div>
    </div>

    <div style="background: #141A2E; border: 4px solid #3A4466; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 22px; color: #4FC3FF">오늘의 칭호</div>
      <div style="display: flex; align-items: center; justify-content: space-between; min-height: 36px; font-size: 22px"><span>그림을 제일 먼저 맞힌 친구</span><span style="color: #FF4FA3">민지</span></div>

      <div style="display: flex; align-items: center; justify-content: space-between; min-height: 36px; font-size: 22px"><span>마지막 조각을 맞춘 친구</span><span style="color: #FFE14D">서연</span></div>
    </div>

    <div style="display: flex; gap: 14px">
      <button style="height: 56px; padding: 0 24px; border: none; background: #39FF88; color: #0B0F1A; box-shadow: 5px 5px 0 #1F6B45; font-family: 'Do Hyeon', sans-serif; font-size: 22px; cursor: pointer">다음 그림 풀기</button>
      <button style="height: 56px; padding: 0 20px; background: transparent; border: 3px solid #3A4466; color: #E8ECFF; font-family: 'Do Hyeon', sans-serif; font-size: 20px; cursor: pointer">그만하기</button>
